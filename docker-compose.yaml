version: '3'

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: testkeycloakuser
      POSTGRES_PASSWORD: testkeycloakpassword
    # ports:
    #   - '54524:5432'
    restart:
      always

  keycloak:      
    image: quay.io/keycloak/keycloak:20.0.3   
    volumes:
      # https://www.keycloak.org/server/importExport
      - ./keycloack/healthcare.json:/opt/keycloak/data/import/healthcare.json
    environment:
      # https://www.keycloak.org/server/all-config
      KC_HOSTNAME: 'localhost:8080'
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: passthrough

      KC_DB: postgres
      KC_DB_USERNAME: testkeycloakuser
      KC_DB_PASSWORD: testkeycloakpassword
      KC_DB_SCHEMA: public
      KC_DB_URL: 'jdbc:postgresql://postgres/keycloakdb'
      KC_LOG_LEVEL: info

      # https://www.keycloak.org/server/containers
      KEYCLOAK_ADMIN: keycloakuser
      KEYCLOAK_ADMIN_PASSWORD: keycloakpassword
    command:
      start-dev --http-relative-path=/ --import-realm
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    restart:
      always
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/realms/healthcare/.well-known/openid-configuration || exit 1
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
  
  minio:
    image: quay.io/minio/minio:RELEASE.2023-01-25T00-19-54Z
    command: server --console-address ":9001" /data/minio/
    hostname: minio
    expose:
      - "9000"
      - "9001"
    # ports:
    #   - '9001:9001'
    #   - '9000:9000'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

      # MINIO_IDENTITY_OPENID_CONFIG_URL: http://keycloak:8080/realms/healthcare/.well-known/openid-configuration      
      # MINIO_IDENTITY_OPENID_CLIENT_ID: nuxt-client
      # MINIO_IDENTITY_OPENID_CLIENT_SECRET: QGBC3dEnVW4si2wNVot5fOQra7RDsRhX

    depends_on:
      keycloak:
        condition: service_healthy
    restart:
      always
  
  profile:      
    build:
      context: ./api/profile
    expose:
      - "3081"
    # ports:
    #   - '3081:3081'
    depends_on:
      - postgres
    restart:
      always
  
  history:      
    build:
      context: ./api/history
    expose:
      - "3082"
    # ports:
    #   - '3082:3082'
    depends_on:
      - postgres
    restart:
      always
  
  nuxt:      
    build:
      context: ./client
    expose:
      - "3000"
    ports:
      - '3000:3000'
    depends_on:
      - postgres
    restart:
      always